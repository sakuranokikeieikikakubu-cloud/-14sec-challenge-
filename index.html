<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ぴったり14秒チャレンジ</title>
<style>
  :root{
    --paper:#FFFBFC;
    --ink:#2E2A2C;
    --ink-soft:#847E80;
    --sakura:#F4AFCB;
    --sakura-deep:#E85298;
    --leaf:#A8CD3A;
    --leaf-deep:#6E9421;
    --gold:#E85298;
    --line:#F0DDE6;
  }
  *{box-sizing:border-box;}
  #app{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic Medium","Rounded Mplus 1c","Hiragino Sans","Yu Gothic","Meiryo",-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:0;
    display:flex;
    justify-content:center;
  }
  .stage{
    width:100%;
    max-width:420px;
    padding:48px 24px 40px;
    display:flex;
    flex-direction:column;
  }
  .eyebrow{
    font-size:13px;
    color:var(--leaf-deep);
    letter-spacing:.02em;
    margin-bottom:6px;
  }
  h1{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic Medium","Rounded Mplus 1c",sans-serif;
    font-size:30px;
    line-height:1.45;
    font-weight:800;
    letter-spacing:.01em;
    margin:0 0 14px;
    color:var(--ink);
  }
  .lede{
    font-size:15px;
    line-height:1.8;
    color:var(--ink-soft);
    margin:0 0 32px;
  }
  label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  input[type=text]{
    width:100%;
    font-size:16px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fff;
    color:var(--ink);
    margin-bottom:20px;
    font-family:inherit;
  }
  input[type=text]:focus{
    outline:none;
    border-color:var(--leaf);
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn-primary{
    width:100%;
    padding:18px;
    font-size:17px;
    font-weight:800;
    color:#fff;
    background:var(--sakura-deep);
    border-radius:999px;
    letter-spacing:.02em;
    transition:transform .15s ease, background .2s ease;
  }
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{background:#C9C2B9;cursor:default;}
  .btn-ghost{
    width:100%;
    padding:14px;
    font-size:14px;
    color:var(--leaf-deep);
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    margin-top:12px;
  }
  .spacer{height:32px;}

  /* play screen */
  .play-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .petal-ring{
    position:relative;
    width:220px;
    height:220px;
    margin-bottom:40px;
  }
  .petal{
    position:absolute;
    width:16px;
    height:24px;
    background:var(--sakura);
    border-radius:60% 60% 60% 0;
    top:50%;
    left:50%;
    opacity:.55;
    transform-origin:center 110px;
    animation:spin 9s linear infinite;
  }
  @keyframes spin{
    from{transform:translate(-50%,-50%) rotate(var(--a)) translateY(-110px) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(var(--a)) translateY(-110px) rotate(-360deg);}
  }
  .push-btn{
    width:220px;
    height:220px;
    border-radius:50%;
    background:var(--sakura-deep);
    color:#fff;
    font-size:20px;
    font-weight:700;
    letter-spacing:.04em;
    box-shadow:0 10px 30px rgba(232,82,152,.28);
    position:absolute;
    top:0;left:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .push-btn:active{transform:scale(.97);}
  .play-hint{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.8;
    max-width:280px;
  }
  .timer-display{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic Medium","Rounded Mplus 1c",sans-serif;
    font-size:42px;
    font-weight:800;
    color:var(--ink);
    margin-bottom:28px;
    font-variant-numeric:tabular-nums;
    transition:opacity .3s linear;
  }

  /* result */
  .result-num{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic Medium","Rounded Mplus 1c",sans-serif;
    font-size:58px;
    font-weight:800;
    margin:8px 0 4px;
    color:var(--leaf-deep);
  }
  .result-sub{
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:28px;
  }
  .result-card{
    border:1px solid var(--line);
    border-radius:20px;
    padding:24px;
    text-align:center;
    margin-bottom:20px;
    background:#fff;
  }

  /* leaderboard */
  .board-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .board-row:first-child{border-top:1px solid var(--line);}
  .rank{
    width:28px;
    font-weight:700;
    color:var(--ink-soft);
    font-size:14px;
  }
  .rank.gold{color:var(--gold);}
  .name-cell{flex:1;font-size:15px;padding-left:6px;}
  .diff-cell{
    font-size:14px;
    font-variant-numeric:tabular-nums;
    color:var(--ink-soft);
  }
  .diff-cell.best{color:var(--leaf-deep);font-weight:700;}
  .loading{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:40px 0;
  }
  .err{
    color:var(--sakura-deep);
    font-size:13px;
    margin-top:-8px;
    margin-bottom:16px;
  }  html, body{
    margin:0;
    padding:0;
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  const TARGET_MS = 14000;
  // ▼ここにGoogle Apps ScriptのWebアプリURL(/execで終わるもの)を貼り付けてください
  const API_URL = 'https://script.google.com/macros/s/AKfycbx7WT3ahtQQHvrtz-qBYpiUF0rppAYy3CezZxqDHuh8uj-5sFI10weBGZTkpvo1PTfY/exec';
  const TOKEN = new URLSearchParams(window.location.search).get('t') || '';
  const app = document.getElementById('app');
  let name = '';
  let startedAt = 0;
  let lastDiffMs = 0;
  let lastElapsedMs = 0;

  function render(html){ app.innerHTML = html; }

  function screenNoToken(){
    render(`
      <div class="stage">
        <div class="eyebrow">14周年記念イベント</div>
        <h1>ぴったり14秒<br>チャレンジ</h1>
        <p class="lede">このページは個別のQRコードから開いてください。お配りしたQRコードを読み取ると、参加用のページが表示されます。</p>
      </div>
    `);
  }

  function screenChecking(){
    render(`<div class="stage"><div class="loading">確認しています…</div></div>`);
  }

  function screenAlreadyUsed(){
    render(`
      <div class="stage">
        <div class="eyebrow">14周年記念イベント</div>
        <h1>チャレンジ済みです</h1>
        <p class="lede">このQRコードはすでに1回チャレンジ済みです。お一人につき1回までとなっています。</p>
      </div>
    `);
  }

  async function init(){
    if(!TOKEN){
      screenNoToken();
      return;
    }
    screenChecking();
    try{
      const res = await fetch(API_URL + '?token=' + encodeURIComponent(TOKEN));
      const json = await res.json();
      if(json && json.used){
        screenAlreadyUsed();
        return;
      }
    }catch(e){
      console.error('check failed', e);
      // チェックに失敗した場合も、送信時の重複チェックがあるのでそのまま進める
    }
    screenStart();
  }

  function screenStart(errMsg){
    render(`
      <div class="stage">
        <div class="eyebrow">14周年記念イベント</div>
        <h1>ぴったり14秒<br>チャレンジ</h1>
        <p class="lede">名前を入れて「スタート」を押すと、その瞬間から計測が始まります。ちょうど14.00秒だと思ったタイミングでボタンを押してください。誰が一番近いか、あとで発表します。</p>
        <label for="nameInput">お名前(またはテーブル名)</label>
        <input type="text" id="nameInput" placeholder="例：営業部 田中" value="${name.replace(/"/g,'&quot;')}" />
        ${errMsg ? `<div class="err">${errMsg}</div>` : ''}
        <div class="spacer"></div>
        <button class="btn-primary" id="startBtn">次へ</button>
      </div>
    `);
    document.getElementById('startBtn').onclick = () => {
      const val = document.getElementById('nameInput').value.trim();
      if(!val){ screenStart('お名前を入力してください'); return; }
      name = val;
      screenPlay();
    };
  }

  const VISIBLE_MS = 4000;   // 数字がはっきり見えている間
  const FADE_END_MS = 6000;  // このタイミングで完全に消える
  let playRafId = null;

  function screenPlay(){
    const petals = Array.from({length:8}).map((_,i)=>{
      const a = (360/8)*i;
      return `<div class="petal" style="--a:${a}deg; animation-delay:${-i*1.1}s;"></div>`;
    }).join('');

    render(`
      <div class="stage">
        <div class="play-wrap">
          <div class="timer-display" id="timerDisplay" style="visibility:hidden;">0.00秒</div>
          <div class="petal-ring" id="petalRing" style="visibility:hidden;">
            ${petals}
            <button class="push-btn" id="pushBtn">14秒だと<br>思ったらタップ</button>
          </div>
          <p class="play-hint" id="playHint">${name} さん、準備ができたら押してください。<br>その瞬間から計測が始まります。</p>
          <button class="btn-primary" id="go" style="max-width:220px; margin-top:24px;">スタート</button>
        </div>
      </div>
    `);

    document.getElementById('go').onclick = () => {
      document.getElementById('go').remove();
      document.getElementById('timerDisplay').style.visibility = 'visible';
      document.getElementById('petalRing').style.visibility = 'visible';
      document.getElementById('playHint').textContent = '数字は最初だけ。すぐ消えるので、そこからは心の中で数えてください。';

      startedAt = performance.now();
      const timerEl = document.getElementById('timerDisplay');
      const tick = () => {
        const elapsed = performance.now() - startedAt;
        timerEl.textContent = (elapsed/1000).toFixed(2) + '秒';
        let opacity;
        if(elapsed <= VISIBLE_MS){
          opacity = 1;
        }else if(elapsed >= FADE_END_MS){
          opacity = 0;
        }else{
          opacity = 1 - (elapsed - VISIBLE_MS) / (FADE_END_MS - VISIBLE_MS);
        }
        timerEl.style.opacity = opacity;
        playRafId = requestAnimationFrame(tick);
      };
      playRafId = requestAnimationFrame(tick);

      document.getElementById('pushBtn').onclick = () => {
        if(playRafId) cancelAnimationFrame(playRafId);
        const elapsed = performance.now() - startedAt;
        lastElapsedMs = elapsed;
        lastDiffMs = Math.abs(elapsed - TARGET_MS);
        submitEntry();
      };
    };
  }

  async function submitEntry(){
    render(`<div class="stage"><div class="loading">記録しています…</div></div>`);
    const entry = {
      name: name,
      elapsedMs: Math.round(lastElapsedMs),
      diffMs: Math.round(lastDiffMs),
      token: TOKEN
    };
    let saveError = false;
    let isDuplicate = false;
    try{
      if(API_URL.indexOf('PASTE_YOUR') !== -1){
        throw new Error('API_URL is not configured yet');
      }
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(entry)
      });
      const json = await res.json();
      if(json && json.result === 'duplicate'){
        isDuplicate = true;
      }
    }catch(e){
      console.error('save failed', e);
      saveError = true;
    }
    if(isDuplicate){
      screenDuplicate();
    }else{
      screenResult(saveError);
    }
  }

  function screenDuplicate(){
    render(`
      <div class="stage">
        <div class="eyebrow">結果</div>
        <h1>チャレンジ済みです</h1>
        <p class="lede">お一人につき1回までとなっています。すでにこのQRコードでチャレンジ済みです。</p>
      </div>
    `);
  }

  function screenResult(saveError){
    const diffSec = (lastDiffMs/1000).toFixed(2);
    const elapsedSec = (lastElapsedMs/1000).toFixed(2);
    render(`
      <div class="stage">
        <div class="eyebrow">結果</div>
        <h1>${name} さん</h1>
        ${saveError ? '<div class="err">記録の送信に失敗しました(スプレッドシート連携が未設定の可能性があります)。結果はこの画面でのみ確認できます。</div>' : ''}
        <div class="result-card">
          <div class="result-sub">あなたが押したのは</div>
          <div class="result-num">${elapsedSec}秒</div>
          <div class="result-sub">目標14.00秒との差 ${diffSec}秒</div>
        </div>
        <p class="lede">チャレンジは以上です。結果発表をお楽しみに。</p>
      </div>
    `);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  init();
})();
</script>
</body>
</html>
